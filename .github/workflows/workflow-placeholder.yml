name: Cron / Stale Issue Cleanup
run-name: Stale Issue Cleanup - ${{ inputs.run-mode || 'scheduled' }}

# A single actions/stale step carries the whole lifecycle:
#
#   day 0   "stale" label + 2-week warning   (240 days of inactivity)
#   day 14  closed as not_planned            (14 days after that warning)
#
# The 14 is the window the warning message promises. actions/stale measures the close from
# updated_at, and applying the label bumps updated_at, so the countdown starts at the warning.
# Both boundaries are approximate: daily polling plus GitHub's schedule delays push each step
# 0-1 days later, never earlier, so issues only ever get more time than the message promises.
#
# Staleness is a rolling inactivity window (actions/stale reads updated_at). Any activity
# before the close clears the label and restarts the 240-day clock: a human comment, or any
# other update to the issue (an edit, a label change, another automation touching it) beyond
# the stale label itself being added. Comments count only when their author type is User, so
# the action's own comments from github-actions[bot] are ignored. One warning, one closure.
#
# Labels required: stale, never-stale. Apply "never-stale" to the Renovate dependency
# dashboard issue (#3306) and anything else that should never be swept.
#
# Comments come from github-actions[bot] via GITHUB_TOKEN.
#
# Each run reports a summary. actions/stale's own enable-statistics output is log-only, so the
# counts are assembled from its two step outputs (staled-issues-prs, closed-issues-prs) plus
# a pre-run snapshot of the label state. Stale labels removed on activity have no output, so
# live runs find them by diffing that snapshot against the issues afterwards. The summary
# always lands in the job summary and the run log. A run that warned, closed, or un-staled at
# least one issue also posts it to Slack: live runs to #team-eng-mobile-notifications, dry
# runs to the automations test channel.

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      run-mode:
        description: 'Run mode'
        type: choice
        default: dry-run
        options:
          - dry-run
          - live
      single-change:
        description: 'Stop after the first issue acted on (at most one warning, closure, or un-stale)'
        type: boolean
        default: false

permissions: {}

# Overlapping runs could both warn the same issue, posting the comment twice, and would
# race on actions/stale's saved progress. A second run queues rather than cancelling the
# first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  RUN_MODE: ${{ inputs.run-mode || 'live' }}

jobs:
  stale-issue-cleanup:
    name: Stale Issue Cleanup
    runs-on: ubuntu-24.04
    permissions:
      # actions/stale saves how far a run got in an Actions cache (key "_state") so a run
      # cut short by operations-per-run resumes there. Listing and replacing that cache
      # needs this; without it the saved progress is either never read or never replaced.
      actions: write
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Log run mode
        run: |
          if [ "${RUN_MODE}" = "live" ]; then
            echo "🔴 Running live: issues will be commented on and closed."
          else
            echo "👀 Dry run: no issue will be modified; Slack goes to the test channel."
          fi

      # Taken before the stale step runs so the counts are never affected by this run's
      # own mutations or by search-index lag behind them.
      - name: Snapshot issue counts
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          _REPO: ${{ github.repository }}
        run: |
          count() {
            gh api -X GET search/issues -f q="repo:$_REPO $1" --jq '.total_count' || echo '?'
          }

          STARTED_AT="$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)"

          if STALE_BEFORE="$(
            gh api --paginate "repos/$_REPO/issues?state=open&labels=stale&per_page=100" \
              --jq '.[] | select(.pull_request | not) | {number, title}'
          )"; then
            STALE_BEFORE="$(printf '%s\n' "$STALE_BEFORE" | jq -sc '.')"
          else
            echo "::warning::Could not list stale issues; the un-stale count will show ?."
            STALE_BEFORE=''
          fi

          {
            echo "open_issues=$(count 'is:issue is:open')"
            echo "in_warning=$(count 'is:issue is:open label:stale')"
            echo "exempt=$(count 'is:issue is:open label:never-stale')"
            echo "started_at=$STARTED_AT"
            echo "stale_before=$STALE_BEFORE"
          } >> "$GITHUB_OUTPUT"

      - name: Warn and close stale issues
        id: stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ github.token }}

          debug-only: ${{ env.RUN_MODE != 'live' }}

          # Warn after 240 days (8 months) of inactivity, then close 14 days later.
          days-before-issue-stale: 240
          days-before-issue-close: 14
          stale-issue-label: stale
          close-issue-reason: not_planned
          exempt-issue-labels: never-stale

          # A human reply clears the stale label and restarts the 240-day clock.
          remove-issue-stale-when-updated: true

          # Skip pull requests entirely.
          days-before-pr-stale: -1
          days-before-pr-close: -1

          # Oldest issues first, so a capped run still makes forward progress on the
          # backlog. Sorting by least recently updated puts every issue due a warning
          # or a closure ahead of any issue still counting down to save operations.
          # single-change drops the budget to 2 since the fetch costs 1 operation,
          # leaving room for exactly one warning or closure.
          ascending: true
          sort-by: ${{ inputs.single-change && 'updated' || 'created' }}
          operations-per-run: ${{ inputs.single-change && 2 || 300 }}

          enable-statistics: true

          stale-issue-message: |
            ⚠️ **Stale Issue Notice**

            This issue has been automatically marked as stale due to inactivity. It will be closed in **2 weeks** if no further activity occurs.

            If this issue is still relevant and you would like to keep it open, please:
            - Comment on this issue to show continued interest
            - Provide any additional information or updates
            - Confirm that the issue still exists in the latest version

            Thank you for your contribution to this project! 🙏

          close-issue-message: |
            🔒 **Issue Closed Due to Inactivity**

            This issue has been automatically closed due to lack of activity for an extended period. We periodically review and close inactive issues to help maintain our issue tracker and focus on current priorities.

            **If this issue is still relevant:**
            - Please create a new issue with updated information
            - Include steps to reproduce the problem if it's a bug report
            - Mention if this issue still occurs in the latest version

            Thank you for your contribution to this project. Your feedback helps us improve! 🙏

      - name: Build stats summary
        id: stats
        env:
          GH_TOKEN: ${{ github.token }}
          _REPO: ${{ github.repository }}
          _MODE: ${{ env.RUN_MODE }}
          _SINGLE_CHANGE: ${{ inputs.single-change }}
          _SERVER_URL: ${{ github.server_url }}
          _RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          _OPEN_ISSUES: ${{ steps.snapshot.outputs.open_issues }}
          _IN_WARNING: ${{ steps.snapshot.outputs.in_warning }}
          _EXEMPT: ${{ steps.snapshot.outputs.exempt }}
          _STARTED_AT: ${{ steps.snapshot.outputs.started_at }}
          _STALE_BEFORE: ${{ steps.snapshot.outputs.stale_before }}
          _NEW_WARNING_NUMBERS: ${{ toJSON(fromJSON(steps.stale.outputs.staled-issues-prs || '[]').*.number) }}
          _NEW_WARNING_TITLES: ${{ toJSON(fromJSON(steps.stale.outputs.staled-issues-prs || '[]').*.title) }}
          _CLOSED_NUMBERS: ${{ toJSON(fromJSON(steps.stale.outputs.closed-issues-prs || '[]').*.number) }}
          _CLOSED_TITLES: ${{ toJSON(fromJSON(steps.stale.outputs.closed-issues-prs || '[]').*.title) }}
        run: |
          len() {
            if [ -z "${1:-}" ]; then
              echo 0
            else
              printf '%s' "$1" | jq 'length'
            fi
          }
          row() { printf '  %-36s %5s\n' "$1" "$2"; }

          # $1 = numbers JSON, $2 = titles JSON (same order), $3 = md|slack
          # Lists every issue, uncapped. Safe because operations-per-run already bounds how
          # many issues one run can touch (~75 at roughly four operations per warning; 56
          # warnings took 227), keeping even a full sweep near 10,000 characters, well inside
          # Slack's 40,000-character text limit. Raise that budget a lot and this is the thing
          # to re-check.
          issue_list() {
            jq -rn \
              --argjson numbers "$1" \
              --argjson titles "$2" \
              --arg base "$_SERVER_URL/$_REPO" \
              --arg fmt "$3" '
                def title:
                  ((.title // "") | if (length > 70) then (.[0:70] + "…") else . end)
                  | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
                def line($f):
                  if $f == "slack"
                  then "• <\($base)/issues/\(.number)|#\(.number)> \(title)"
                  else "- [#\(.number)](\($base)/issues/\(.number)) \(title)"
                  end;
                $numbers | to_entries[] | {number: .value, title: $titles[.key]} | line($fmt)
              '
          }

          section() {
            if [ "$2" -eq 0 ]; then
              return 0
            fi
            if [ "$5" = "slack" ]; then
              printf '\n*%s (%s)*\n' "$1" "$2"
            else
              printf '\n**%s (%s)**\n' "$1" "$2"
            fi
            issue_list "$3" "$4" "$5"
          }

          NEW_WARNINGS="$(len "$_NEW_WARNING_NUMBERS")"
          CLOSED="$(len "$_CLOSED_NUMBERS")"

          UNSTALED_JSON='[]'
          UNSTALED_TEXT='n/a'
          if [ "$_MODE" = "live" ]; then
            if [ -n "${_STALE_BEFORE:-}" ] && UNLABELLED="$(
              gh api --paginate \
                "repos/$_REPO/issues?state=all&since=$_STARTED_AT&per_page=100" \
                --jq '.[] | select(any(.labels[]; .name == "stale") | not) | .number'
            )"; then
              UNSTALED_JSON="$(
                printf '%s\n' "$UNLABELLED" | jq -sc --argjson before "$_STALE_BEFORE" \
                  '. as $now | [$before[] | select(.number as $n | $now | any(. == $n))]'
              )"
              UNSTALED_TEXT=''
            else
              echo "::warning::Could not work out which stale labels this run removed."
              UNSTALED_TEXT='?'
            fi
          fi
          UNSTALED_NUMBERS="$(printf '%s' "$UNSTALED_JSON" | jq -c '[.[].number]')"
          UNSTALED_TITLES="$(printf '%s' "$UNSTALED_JSON" | jq -c '[.[].title]')"
          UNSTALED="$(len "$UNSTALED_NUMBERS")"
          UNSTALED_TEXT="${UNSTALED_TEXT:-$UNSTALED}"

          if [ "$_MODE" = "live" ]; then
            MODE_TEXT="live"
          else
            MODE_TEXT="DRY RUN - no issue was modified"
          fi

          body() {
            local header=false
            if [ "$1" = "full" ] || [ "$_MODE" != "live" ]; then
              printf 'Mode: %s\n' "$MODE_TEXT"
              header=true
            fi
            if [ "$_SINGLE_CHANGE" = "true" ]; then
              printf 'Single change: on - stopped after the first issue acted on\n'
              header=true
            fi
            if [ "$header" = "true" ]; then
              printf '\n'
            fi
            printf 'Pipeline at start of run\n'
            row 'Open issues:' "$_OPEN_ISSUES"
            row 'Awaiting closure (2-week warning):' "$_IN_WARNING"
            if [ "$1" = "full" ]; then
              row 'Exempt (never-stale):' "$_EXEMPT"
            fi
            printf '\nActions this run\n'
            row 'New 2-week warnings posted:' "$NEW_WARNINGS"
            row 'Issues closed:' "$CLOSED"
            row 'Stale labels removed (activity):' "$UNSTALED_TEXT"
          }

          BODY="$(body full)"
          BODY_SLACK="$(body slack)"

          SECTIONS_MD="$(
            section 'Issues closed' "$CLOSED" "$_CLOSED_NUMBERS" "$_CLOSED_TITLES" md
            section 'New 2-week warnings posted' "$NEW_WARNINGS" \
              "$_NEW_WARNING_NUMBERS" "$_NEW_WARNING_TITLES" md
            section 'Stale labels removed on new activity' "$UNSTALED" \
              "$UNSTALED_NUMBERS" "$UNSTALED_TITLES" md
          )"
          SECTIONS_SLACK="$(
            section 'Issues closed' "$CLOSED" "$_CLOSED_NUMBERS" "$_CLOSED_TITLES" slack
            section 'New 2-week warnings posted' "$NEW_WARNINGS" \
              "$_NEW_WARNING_NUMBERS" "$_NEW_WARNING_TITLES" slack
            section 'Stale labels removed on new activity' "$UNSTALED" \
              "$UNSTALED_NUMBERS" "$UNSTALED_TITLES" slack
          )"

          echo "$BODY"
          if [ -n "$SECTIONS_MD" ]; then
            echo "$SECTIONS_MD"
          fi

          {
            echo "### Stale Issue Cleanup"
            echo '```'
            echo "$BODY"
            echo '```'
            if [ -n "$SECTIONS_MD" ]; then
              echo "$SECTIONS_MD"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          jq -n \
            --arg body "$BODY_SLACK" \
            --arg sections "$SECTIONS_SLACK" \
            --arg url "$_RUN_URL" \
            --arg repo "$_REPO" \
            '{text: (":broom: *Stale Issue Cleanup:* \($repo) - <\($url)|run details>\n```\n\($body)\n```\n" + $sections)}' \
            > slack-payload.json

          if [ $(( NEW_WARNINGS + CLOSED + UNSTALED )) -gt 0 ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "No issue was warned, closed, or un-staled, so Slack will be skipped."
          fi

      - name: Log in to Azure
        if: steps.stats.outputs.notify == 'true'
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Retrieve Slack secrets
        id: retrieve-slack-secrets
        if: steps.stats.outputs.notify == 'true'
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: gh-android
          secrets: "SLACK-WEBHOOK-TEAM-ENG-MOBILE-NOTIFICATIONS,SLACK-WEBHOOK-AUTOMATIONS-TEST-CHANNEL"

      - name: Log out from Azure
        if: steps.stats.outputs.notify == 'true'
        uses: bitwarden/gh-actions/azure-logout@main

      - name: Send Slack notification
        if: steps.stats.outputs.notify == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.RUN_MODE == 'live' && steps.retrieve-slack-secrets.outputs.SLACK-WEBHOOK-TEAM-ENG-MOBILE-NOTIFICATIONS || steps.retrieve-slack-secrets.outputs.SLACK-WEBHOOK-AUTOMATIONS-TEST-CHANNEL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
