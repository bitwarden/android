name: 'Setup Android Build'
description: 'Setup Android build environment with Gradle, Ruby, JDK, Android NDK, and Fastlane'
inputs:
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'
runs:
  using: 'composite'
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: Configure Ruby
      uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
      with:
        bundler-cache: true

    - name: Configure JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: "temurin"
        java-version: ${{ inputs.java-version }}

    - name: Install Android NDK
      shell: bash
      run: |
        NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
        if [ -z "$NDK_VERSION" ]; then
          echo "::error::Unable to read ndk version from gradle/libs.versions.toml"
          exit 1
        fi
        echo "Installing NDK $NDK_VERSION"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null

    - name: Install Fastlane
      shell: bash
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
